<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuração pendente | Lohmann do Brasil</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    body{background:#101010;color:#fff;font-family:Arial,sans-serif}
    .fallback{min-height:100vh;display:grid;place-items:center;padding:32px}
    .fallback-card{max-width:760px;background:#171717;border:1px solid rgba(247,168,23,.35);padding:36px;border-radius:24px}
    .fallback-card img{width:150px;margin-bottom:24px}
    .fallback-card h1{font-size:38px;margin:0 0 14px}
    .fallback-card p{line-height:1.7;color:#ddd}
    .fallback-card code{background:#2a2a2a;color:#f7a817;padding:3px 6px;border-radius:6px}
  </style>
</head>
<body>
  <main class="fallback">
    <section class="fallback-card">
      <img src="/assets/logo-lohmann-header-white.png" alt="Lohmann do Brasil">
      <h1>Pages Function não foi ativada.</h1>
      <p>Este arquivo é apenas um fallback. O site final deve ser renderizado por <code>functions/[[path]].js</code>, que chama <code>src/index.js</code>.</p>
      <p>Confira se a pasta <code>functions</code> está na raiz do repositório e se o deploy foi feito via GitHub, não apenas upload estático.</p>
    </section>
  </main>
</body>
</html>
